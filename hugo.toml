# 陽明交大竹韻口琴社官方網站
# 正式網域:https://harmonica.nycu.club/
# GitHub Actions 也會明確使用此正式網域，避免 Pages 回傳的 github.io base URL
# 汙染 canonical、Open Graph、RSS 與 sitemap。
baseURL = "https://harmonica.nycu.club/"
title = "陽明交大竹韻口琴社"
languageCode = "zh-TW"
defaultContentLanguage = "zh-tw"
hasCJKLanguage = true
timeZone = "Asia/Taipei"
enableRobotsTXT = true
enableGitInfo = false
disableKinds = ["taxonomy", "term"]

[pagination]
pagerSize = 12

[outputs]
home = ["html", "rss", "sitemap"]
section = ["html", "rss"]

[services.rss]
limit = 20

[sitemap]
changefreq = "weekly"
priority = 0.5

[markup.goldmark.renderer]
# Sheet 內文一律當純 Markdown,不允許 raw HTML(防呆與防注入)
unsafe = false

[params]
description = "國立陽明交通大學竹韻口琴社官方網站——口琴教學、演出、社課與活動資訊。"
# 現有 Bamboo 公開 Calendar 已由 Sky 核准用於網站完整活動時程。
calendarId = "bmhc1968@gmail.com"
# 對外公開的社團聯絡信箱(與行事曆同一個 Google 帳號,已因行事曆嵌入而公開)。
contactEmail = "bmhc1968@gmail.com"

# 編年史頁的限時「開放回報」提示。過期後前端自動隱藏,重建後也不再輸出。
[params.chronologyContribute]
enabled = true
url = "https://docs.google.com/forms/d/e/1FAIpQLSfXHQnJanusPzTYdKhAyApHzeRUdEFIn6y1Xbg9FugZ18RguA/viewform"
# 表單回覆分頁「表單回覆 1」的 gid;清空可停用即時回報清單。
gid = "1453768960"
expires = "2026-08-13T00:00:00+08:00"

# 全站臨時公告 popup。改公告內容時記得換 id,否則已按過關閉的訪客不會再看到。
[params.announcement]
enabled = true
id = "reunion-tea-2026"
# 臺灣口琴音樂節 2026-08-07 ~ 08-09;音樂節結束(8/9 整天過完)即下架。
expires = "2026-08-10T00:00:00+08:00"

[params.websiteAgent]
enabled = true
endpoint = "https://skyhong-cclabmacmini.tailf76d1d.ts.net:8443/ask"
maxQuestionChars = 500

[[menus.main]]
name = "首頁"
pageRef = "/"
weight = 10

[[menus.main]]
name = "編年史"
pageRef = "/chronology"
weight = 25

[[menus.main]]
name = "關於我們"
pageRef = "/about"
weight = 30
