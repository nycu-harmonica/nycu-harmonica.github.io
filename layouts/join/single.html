{{- $target := .Params.redirectURL -}}
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  {{ partial "head.html" . }}
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="0; url={{ $target }}">
  <script>window.location.replace({{ $target | jsonify | safeJS }});</script>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f4f7fb; color: #17233c; }
    main { max-width: 32rem; padding: 2rem; text-align: center; }
    a { color: #1456a0; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1 data-seo-heading>加入陽明交大竹韻口琴社</h1>
    <p>正在前往竹韻口琴社入社表單……</p>
    <p><a href="{{ $target }}">若未自動前往，請點此開啟表單</a></p>
  </main>
</body>
</html>
