{{ $events := site.Data.generated.chronology_events | default (slice) }}
<div class="chronology-timeline" aria-label="竹韻口琴社編年史時間線" data-sheet-chronology>
  <div class="chronology-list" data-sheet-chronology-list>
    {{ range sort $events "sort_date" "desc" }}
      <article class="chronology-item" data-chronology-event data-chronology-id="{{ .id }}">
        <div class="chronology-event-time">
          <time datetime="{{ .sort_date }}">{{ .date_label }}</time>
        </div>
        <div class="chronology-event-body">
          <p class="chronology-event-statement">{{ .statement }}</p>
          <a class="chronology-source" href="{{ .source_url }}" target="_blank" rel="noopener">{{ .source_label }}</a>
        </div>
      </article>
    {{ end }}
  </div>
</div>
