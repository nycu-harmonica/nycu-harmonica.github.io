# 演出 Portal 的公開內容。換場次時只需要更新這個檔案並重新部署。
status: 現場演出
kicker: NYCU BAMBOO MELODY HARMONICA CLUB
title: 陽明交大竹韻口琴社
subtitle: 用一把口琴，吹出屬於你的旋律
welcome: 歡迎來到竹韻的演出現場
intro: 現在臺上的十五分鐘，是竹韻復社後第一次站回陽明交大的舞臺。這個頁面會陪你聽完整場——每一首曲子、每一把琴，還有怎麼加入我們。
screen_prompt: 掃描 QR Code，開啟今日節目單
story_duration: 7000
program:
  - title: Tradition ／ Matchmaker
    credit: 《屋頂上的提琴手》配樂
    note: 開場先熱鬧一點。百老匯音樂劇的兩段旋律，小提琴的戲換口琴來演——聽聽看和弦口琴怎麼把整個樂隊扛起來。
    media:
      type: video
      src: images/portal-songs/fiddler.mp4
      poster: images/portal-songs/fiddler-poster.jpg
      credit: 畫面｜電影《屋頂上的提琴手》（1971）
  - title: 風之丘
    credit: 久石讓／《魔女宅急便》配樂
    note: 久石讓寫給琪琪起飛的那陣風。半音階口琴的音色跟吉卜力特別合，這首會讓你記住「口琴原來長這樣」。
    media:
      type: image
      src: images/portal-songs/kiki.webp
      credit: 畫面｜《魔女宅急便》© 1989 角野栄子・Studio Ghibli・N
  - title: Just the Way You Are
    credit: Bruno Mars
    note: 你一定會唱的一首。試試看：副歌的時候抬頭找低音口琴——整首歌的心跳都是他。
    media:
      type: video
      src: images/portal-songs/bruno.mp4
      poster: images/portal-songs/bruno-poster.jpg
      credit: 畫面｜Bruno Mars〈Just the Way You Are〉MV
  - title: 孤單北半球
    credit: 林依晨
    note: 壓軸回到華語歌。2004 年的旋律，用四把口琴重新編過。聽完這首，接著看看臺上三種不一樣的口琴。
    media:
      type: video
      src: images/portal-songs/gudan.mp4
      poster: images/portal-songs/gudan-poster.jpg
      credit: 畫面｜林依晨〈孤單北半球〉MV・滾石唱片

# 曲目結束後，先介紹口琴重奏，再拆解臺上的三種口琴。
ensemble:
  kicker: HARMONICA ENSEMBLE
  title: 四把口琴，怎麼變成一個樂團？
  body: 口琴重奏把旋律、和聲、節奏與低音分給不同聲部。有人唱主旋律，有人補和聲，也有人撐住節拍與低音——合在一起，就像一支縮小的樂團。
  media:
    type: video
    src: images/portal-ensemble/sirius.mp4
    poster: images/portal-ensemble/sirius-poster.jpg
    credit: 畫面｜天狼星口琴樂團〈殘酷天使的行動綱領〉MV
    source_url: https://www.youtube.com/watch?v=4W_CZl4FBdY
  stats:
    - value: "4"
      label: 位演奏者
    - value: "3"
      label: 種口琴
    - value: "1"
      label: 個完整樂團
  footer: 這次的編制是兩把半音階口琴、一把和弦口琴與一把低音口琴。

# 臺上共有四把琴，但只有三種口琴：兩把半音階、一把和弦、一把低音。
instruments:
  - kicker: THREE HARMONICAS ・ 01/03
    title: 半音階口琴
    role: 旋律｜像樂團的小提琴
    body: 右側的按鍵可以吹出升降音。臺上兩位演奏者分別擔任第一、第二部，在主旋律與和聲之間接力。
    media:
      src: images/portal-instruments/chromatic.webp
      alt: 竹韻社員演奏半音階口琴
      credit: 竹韻歷史影像｜2015 期末音樂會
  - kicker: THREE HARMONICAS ・ 02/03
    title: 和弦口琴
    role: 節奏與和聲｜一個人撐起整組伴奏
    body: 琴身接近半公尺，一次能吹出完整和弦。它把每一拍接起來，讓四把口琴真的像一個樂團。
    media:
      src: images/portal-instruments/chord.webp
      alt: 竹韻社員演奏長型和弦口琴
      credit: 竹韻歷史影像｜2015 期末音樂會
  - kicker: THREE HARMONICAS ・ 03/03
    title: 低音口琴
    role: 低音｜全場最低的地基
    body: 上下兩排的低音口琴負責最深、最穩的聲音。旋律飛得再高，都由它把整首曲子牢牢托住。
    media:
      src: images/portal-instruments/bass.webp
      alt: 竹韻社員演奏雙層低音口琴
      credit: 竹韻歷史影像｜2015 期末音樂會

# 曲目和樂器之後、入社之前的介紹頁。body 一項是一段。
features:
  - kicker: SINCE 1968 ・ REBORN 2026
    title: 沉寂多年，那一夜我們重新聚在一起
    duration: 10000
    body:
      - 2026 年 8 月 9 日，老社員與新夥伴在陽明交大重逢。從 1968 年的交大口琴社，到沉寂後復社，竹韻重新有人接著吹下去。
      - 你現在聽到的演出，來自復社後第一個學期；下一段旋律，等新社員一起接下去。
    media:
      src: images/portal-history/revival-tea-2026.webp
      alt: 2026 年 8 月 9 日竹韻復社茶會大合照
      credit: 2026 復社茶會｜陽明交大學生活動中心
      pan: left-to-right

