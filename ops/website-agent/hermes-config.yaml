model:
  # Routed through the local AI gateway (CLIProxyAPI); the alias is owned by
  # ~/Projects/ai-gateway/model-policy.json. Previous local route kept below.
  default: sky-fast
  provider: custom:ai-gateway-sky-fast
  base_url: ""
  context_length: 65536
  max_tokens: 250

providers:
  # Named local providers resolve to "custom" for core timeout lookup.
  custom:
    request_timeout_seconds: 55
    stale_timeout_seconds: 55
  ai-kot-gg-luna:
    # Existing credential returns 401. Retain it without retrying this route.
    enabled: false
    api: https://ai.kot.gg
    key_env: AI_KOT_GG_API_KEY
    transport: codex_responses
    default_model: gpt-5.6-luna
  ai-gateway-sky-fast:
    api: http://127.0.0.1:8317/v1
    key_env: AI_GATEWAY_API_KEY
    transport: chat_completions
    default_model: sky-fast
    context_length: 65536
    extra_body:
      max_tokens: 250
      temperature: 0.2
  ollama-qwen35-local:
    # Dedicated service: Q4 KV, one slot, no global Ollama setting changes.
    api: http://127.0.0.1:11435/v1
    key_env: OLLAMA_API_KEY
    transport: chat_completions
    default_model: qwen3.5:9b
    context_length: 65536
    extra_body:
      think: false
      keep_alive: 30s
      # The gateway does not forward the facade's generation limit.
      max_tokens: 250
      temperature: 0.2

# Use the verified local route directly; do not retry a known invalid remote key.
fallback_providers: []

# Explicitly empty capability surface. no_mcp prevents globally configured MCP
# servers from being inherited by this public-facing profile.
platform_toolsets:
  cli:
    - no_mcp
  api_server:
    - no_mcp

agent:
  max_turns: 1
  api_max_retries: 1
  auto_recovery_cycles: 0
  task_completion_guidance: false
  environment_probe: false
  coding_context: "off"
  reasoning_effort: "none"
  disabled_toolsets:
    - web
    - browser
    - terminal
    - file
    - code_execution
    - vision
    - video
    - image_gen
    - video_gen
    - x_search
    - tts
    - skills
    - todo
    - memory
    - context_engine
    - session_search
    - clarify
    - delegation
    - cronjob
    - homeassistant
    - spotify
    - discord
    - discord_admin
    - yuanbao
    - computer_use

memory:
  memory_enabled: false
  user_profile_enabled: false
  provider: ""

gateway:
  # Keep this public facade isolated from the officer-facing Bamboo gateway.
  standalone: true
  strict: true
  trust_recent_files: false
  api_server:
    max_concurrent_runs: 1
